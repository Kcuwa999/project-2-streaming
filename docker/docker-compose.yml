services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: "ВПИШИТЕ_ПОРТ_ZOOKEEPER"
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "ВПИШИТЕ_ПОРТ_ZOOKEEPER:ВПИШИТЕ_ПОРТ_ZOOKEEPER"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "ВПИШИТЕ_ПОРТ_KAFKA:ВПИШИТЕ_ПОРТ_KAFKA"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:ВПИШИТЕ_ПОРТ_ZOOKEEPER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:ВПИШИТЕ_ПОРТ_KAFKA
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "ВПИШИТЕ_ПОЛЬЗОВАТЕЛЬ"
      POSTGRES_PASSWORD: "ВПИШИТЕ_ПАРОЛЬ"
      POSTGRES_DB: "ВПИШИТЕ_БАЗА"
    ports:
      - "ВПИШИТЕ_ПОРТ_POSTGRES:5432"
